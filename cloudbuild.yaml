substitutions:
  _REGION: australia-southeast1
  _SERVICE_NAME: vapi-dev-api
  _ARTIFACT_REPO: vapi-dev-containers
  _RUNTIME_SERVICE_ACCOUNT: vapi-dev-api@dva-sop-dev.iam.gserviceaccount.com
  _CLOUDSQL_INSTANCE: dva-sop-dev:australia-southeast1:vapi-dev-postgres

steps:
  - name: gcr.io/cloud-builders/docker
    id: Build API container
    args:
      - build
      - -f
      - backend/src/VirtualAdvocatePI.Api/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE_NAME}:${BUILD_ID}
      - .

  - name: gcr.io/cloud-builders/docker
    id: Push API container
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE_NAME}:${BUILD_ID}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: Deploy API to Cloud Run
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE_NAME}:${BUILD_ID}
      - --region=${_REGION}
      - --platform=managed
      - --service-account=${_RUNTIME_SERVICE_ACCOUNT}
      - --add-cloudsql-instances=${_CLOUDSQL_INSTANCE}
      - --update-secrets=DATABASE_CONNECTION_STRING=vapi-dev-db-connection-string:latest
      - --set-env-vars=FIREBASE_PROJECT_ID=dva-sop-dev,EVIDENCE_BUCKET_NAME=dva-sop-dev-vapi-dev-evidence
      - --no-invoker-iam-check
      - --port=8080

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE_NAME}:${BUILD_ID}
